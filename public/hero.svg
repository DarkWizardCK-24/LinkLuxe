<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="A long tangled link flows through the LinkLuxe mark and becomes a short elegant link">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8E6BC"/>
      <stop offset="0.38" stop-color="#E8BE7A"/>
      <stop offset="0.72" stop-color="#E39C8C"/>
      <stop offset="1" stop-color="#B8693F"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8BE7A" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#E39C8C" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#F8E6BC"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A1F18"/>
      <stop offset="1" stop-color="#18110D"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E39C8C" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#E39C8C" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect x="46" y="136" width="290" height="248" rx="16"/></clipPath>
  </defs>

  <circle cx="480" cy="262" r="150" fill="url(#halo)"/>

  <!-- long ugly url card -->
  <rect x="28" y="92" width="330" height="336" rx="30" fill="url(#card)" stroke="#E8BE7A" stroke-opacity="0.22" stroke-width="2"/>
  <circle cx="62" cy="120" r="6" fill="#E39C8C" fill-opacity="0.7"/>
  <circle cx="84" cy="120" r="6" fill="#E8BE7A" fill-opacity="0.7"/>
  <circle cx="106" cy="120" r="6" fill="#F8E6BC" fill-opacity="0.7"/>
  <g clip-path="url(#clip)" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="15" fill="#A8978A">
    <text x="58" y="162">https://www.example-store.com</text>
    <text x="58" y="186" fill="#8F7E70">/collections/summer-2026/prod</text>
    <text x="58" y="210" fill="#A8978A">ucts/linen-shirt-sand?variant=</text>
    <text x="58" y="234" fill="#8F7E70">4418820193&amp;utm_source=newsle</text>
    <text x="58" y="258" fill="#A8978A">tter&amp;utm_medium=email&amp;utm_ca</text>
    <text x="58" y="282" fill="#8F7E70">mpaign=summer_launch_final_v3</text>
    <text x="58" y="306" fill="#A8978A">&amp;ref=hero-banner&amp;session=a9f3</text>
    <text x="58" y="330" fill="#8F7E70">c1e7b2d4&amp;gclid=Cj0KCQjwx9ayB</text>
    <text x="58" y="354" fill="#A8978A">hDRARIsAEzpracticeJ0W8xYq3Lm</text>
    <text x="58" y="378" fill="#8F7E70">pQ2rVn7uT#reviews-section-42</text>
  </g>
  <rect x="46" y="330" width="290" height="54" fill="url(#card)" opacity="0.8" clip-path="url(#clip)"/>

  <!-- tangled strands -->
  <g fill="none" stroke="url(#flow)" stroke-linecap="round" stroke-width="3">
    <path d="M358 190 C 400 140, 420 330, 456 262"/>
    <path d="M358 262 C 410 330, 400 190, 456 262" stroke-opacity="0.85"/>
    <path d="M358 334 C 396 250, 424 160, 456 262" stroke-opacity="0.7"/>
    <path d="M358 226 C 384 300, 430 210, 456 262" stroke-opacity="0.5" stroke-width="2"/>
    <path d="M358 298 C 392 190, 414 320, 456 262" stroke-opacity="0.5" stroke-width="2"/>
  </g>

  <!-- the mark -->
  <g transform="translate(480 262)">
    <rect x="-64" y="-64" width="128" height="128" rx="34" fill="#150F0B" stroke="url(#gold)" stroke-width="3"/>
    <g fill="none" stroke="url(#gold)" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-26 -34 V12 a14 14 0 0 0 14 14 H8" stroke-width="13"/>
      <rect x="2" y="10" width="40" height="26" rx="13" stroke-width="8"/>
    </g>
    <path d="M28 -44 C29 -34 32 -31 42 -30 C32 -29 29 -26 28 -16 C27 -26 24 -29 14 -30 C24 -31 27 -34 28 -44 Z" fill="url(#gold)"/>
  </g>

  <!-- elegant output -->
  <path d="M544 262 C 590 262, 600 262, 636 262" fill="none" stroke="url(#flow)" stroke-width="5" stroke-linecap="round"/>
  <rect x="636" y="214" width="296" height="96" rx="48" fill="#1A130F" stroke="url(#gold)" stroke-width="3"/>
  <text x="784" y="272" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="25" font-weight="700" fill="#F8E6BC">linkluxe.app/<tspan fill="#E39C8C">summer</tspan></text>

  <!-- analytics chips -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600">
    <rect x="636" y="338" width="138" height="42" rx="21" fill="#1A130F" stroke="#E8BE7A" stroke-opacity="0.3"/>
    <text x="705" y="365" text-anchor="middle" fill="#E8BE7A">1,284 clicks</text>
    <rect x="788" y="338" width="144" height="42" rx="21" fill="#1A130F" stroke="#E39C8C" stroke-opacity="0.3"/>
    <text x="860" y="365" text-anchor="middle" fill="#E39C8C">QR ready</text>
  </g>
  <g fill="url(#gold)">
    <path d="M900 156 C902 174 908 180 926 182 C908 184 902 190 900 208 C898 190 892 184 874 182 C892 180 898 174 900 156 Z"/>
    <path d="M620 168 C621 176 624 179 632 180 C624 181 621 184 620 192 C619 184 616 181 608 180 C616 179 619 176 620 168 Z" opacity="0.8"/>
  </g>
</svg>
